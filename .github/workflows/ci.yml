name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Ruff
        run: ruff check .
      - name: Compile core modules
        run: python -m compileall -q src app
      - name: Pytest
        run: pytest -q
      - name: Train and register synthetic candidate
        run: python -m src.train_and_register --artifact-dir artifacts/model --registry artifacts/registry.db --rows 2000 --promote
      - name: API liveness and readiness smoke test
        run: |
          python -c "from app.api import health, readiness; assert health()['status'] == 'ok'; assert readiness()['status'] in {'ready', 'degraded'}"

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t banking-risk-ml-platform:ci .
