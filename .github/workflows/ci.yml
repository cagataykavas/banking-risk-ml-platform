name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -q
      - run: python -m src.train_and_register --artifact-dir artifacts/model --registry artifacts/registry.db --rows 2000 --promote
      - run: python -c "from app.api import health; assert health()['status'] == 'ok'"

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t banking-risk-ml-platform:ci .
